name: Petshop preview assets cleanup

# One-off: removes the temporary release that held the hero images for the preview.
on:
  push:
    paths:
      - .github/workflows/petshop-preview-assets.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete petshop-preview-assets -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
