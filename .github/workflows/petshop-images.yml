name: Petshop images

# Downloads the generated photos listed in petshop/scripts/images.json,
# converts them to optimised WebP and commits them to the branch.
on:
  push:
    paths:
      - petshop/scripts/images.json
      - .github/workflows/petshop-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: petshop-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and optimise
        working-directory: petshop
        run: |
          npm ci --no-audit --no-fund
          npm run images

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add petshop/public/images
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          git commit -m "Add optimised petshop photos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
